graph:
  pocket_cutoff: 8.0
  interface_cutoff: 5.0
  protein_spatial_cutoff: 5.0
  ligand_spatial_cutoff: 4.5
  max_spatial_neighbors: 32
  distance_rbf_dim: 16
  rwpe_dim: 20

model:
  hidden_dim: 256
  prelude_layers: 1
  dropout: 0.10
  layerscale_init: 0.10
  use_endpoint_context: true
  train_recycles: [2, 3, 4, 6, 8]
  train_recycle_probs: [0.25, 0.25, 0.20, 0.20, 0.10]
  eval_recycles: 6

train:
  seed: 42
  batch_size: 16
  num_workers: 4
  epochs: 100
  lr: 0.0002
  weight_decay: 0.00001
  grad_clip: 5.0
  loss: huber
  huber_delta: 1.0
  amp: true
  early_stop_patience: 20

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bapred2"
version = "0.1.0"
description = "Recurrent graph inference for protein-ligand binding affinity prediction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Jaemin Sim" }]
dependencies = [
  "torch>=2.7.0",
  "torch-geometric>=2.8.0",
  "rdkit>=2025.9.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "tqdm>=4.67",
]

[project.scripts]
bapred2-train = "bapred2.train:main"
bapred2-eval = "bapred2.evaluate:main"
bapred2-preprocess = "bapred2.data.preprocess:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 120
